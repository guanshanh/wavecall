services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8080:8080"
      # WebRTC UDP ports
      - "49152-49252:49152-49252/udp"
    environment:
      - WAVECALL_STUN=stun:stun.l.google.com:19302
      - WAVECALL_TURN=turn:coturn:3478
      - WAVECALL_TURN_USER=wavecall
      - WAVECALL_TURN_PASS=changeme
    depends_on:
      - coturn
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "49152-49252:49152-49252/udp"
    command:
      - "--listening-port=3478"
      - "--tls-listening-port=5349"
      - "--min-port=49152"
      - "--max-port=49252"
      - "--user=wavecall:changeme"
      - "--realm=wavecall.local"
      - "--no-cli"
      - "--no-tls"
      - "--fingerprint"
      - "--lt-cred-mech"
    restart: unless-stopped
